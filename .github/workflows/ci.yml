name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

# Runners are pinned to ubuntu-24.04 (glibc 2.39), not ubuntu-latest: the
# timing lanes link with Alire's gcc against the runner's glibc, then run
# under the flake's loader and glibc. A runner image newer than the flake's
# glibc breaks them ("GLIBC_2.43 not found"). Move the image and the
# flake's nixpkgs together, deliberately.
jobs:
  check:
    env:
      ALR_NON_INTERACTIVE: "1"
      NO_COLOR: "1"
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: false

      # DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d

      - name: Build and smoke test
        run: nix develop --command bash ci/check.sh
      - name: Differential fuzz (tiers vs proven SPARK, 60 s)
        run: nix develop --command bash ci/fuzz.sh 60
      - name: Instruction-set gate (DOIT allowlists)
        run: nix develop --command bash ci/mnemonics.sh

  ctgrind:
    env:
      ALR_NON_INTERACTIVE: "1"
      NO_COLOR: "1"
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: false

      # DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d

      - name: Constant-time ctgrind checks
        run: nix develop --command bash ci/timing.sh ctgrind
